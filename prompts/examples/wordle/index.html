<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neon Words</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Neon Words</h1>
    <p class="game-description">Guess the secret 5-letter word in 6 tries. Green = right letter, right place. Yellow = right letter, wrong place.</p>
    <ul class="game-controls">
      <li>A-Z to type a letter</li>
      <li>Backspace to delete</li>
      <li>Enter to submit a guess</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const WORDS = [
    "ABOUT","ABOVE","ABUSE","ACTOR","ACUTE","ADMIT","ADOPT","ADULT","AFTER","AGAIN",
    "AGENT","AGREE","AHEAD","ALARM","ALBUM","ALERT","ALIKE","ALIVE","ALLOW","ALONE",
    "ALONG","ALTER","AMONG","ANGER","ANGLE","ANGRY","APART","APPLE","APPLY","ARENA",
    "ARGUE","ARISE","ARRAY","ASIDE","ASSET","AVOID","AWAKE","AWARD","AWARE","BADLY",
    "BAKER","BASES","BASIC","BEACH","BEGAN","BEGIN","BEING","BELOW","BENCH","BIRTH",
    "BLACK","BLAME","BLANK","BLIND","BLOCK","BLOOD","BOARD","BOOST","BOOTH","BOUND",
    "BRAIN","BRAND","BREAD","BREAK","BREED","BRIEF","BRING","BROAD","BROKE","BROWN",
    "BUILD","BUILT","BUYER","CABLE","CARRY","CATCH","CAUSE","CHAIN","CHAIR","CHART",
    "CHASE","CHEAP","CHECK","CHEST","CHIEF","CHILD","CHINA","CIVIL","CLAIM","CLEAN",
    "CLEAR","CLICK","CLOCK","CLOSE","COACH","COAST","COULD","COUNT","COURT","COVER",
    "CRAFT","CRASH","CREAM","CRIME","CROSS","CROWD","CROWN","CURVE","CYCLE","DAILY",
    "DANCE","DEALT","DEATH","DEPTH","DOING","DOUBT","DOZEN","DRAFT","DRAMA","DRAWN",
    "DREAM","DRESS","DRILL","DRINK","DRIVE","DROVE","EARLY","EARTH","EIGHT","ELITE",
    "EMPTY","ENEMY","ENJOY","ENTER","ENTRY","EQUAL","ERROR","EVENT","EVERY","EXACT",
    "EXIST","EXTRA","FAITH","FALSE","FAULT","FIBRE","FIELD","FIFTH","FIFTY","FIGHT",
    "FINAL","FIRST","FIXED","FLASH","FLEET","FLOOR","FLUID","FOCUS","FORCE","FORTH",
    "FORTY","FORUM","FOUND","FRAME","FRANK","FRAUD","FRESH","FRONT","FROST","FRUIT",
    "FULLY","FUNNY","GIANT","GIVEN","GLASS","GLOBE","GOING","GRACE","GRADE","GRAND",
    "GRANT","GRASS","GREAT","GREEN","GROSS","GROUP","GROWN","GUARD","GUESS","GUEST",
    "GUIDE","HAPPY","HARSH","HEART","HEAVY","HENCE","HORSE","HOTEL","HOUSE","HUMAN",
    "IDEAL","IMAGE","INDEX","INNER","INPUT","ISSUE","JOINT","JUDGE","KNOWN","LABEL",
    "LARGE","LASER","LATER","LAUGH","LAYER","LEARN","LEASE","LEAST","LEAVE","LEGAL",
    "LEVEL","LIGHT","LIMIT","LOCAL","LOGIC","LOOSE","LOWER","LUCKY","LUNCH","LYING",
    "MAGIC","MAJOR","MAKER","MARCH","MATCH","MAYBE","MAYOR","MEANT","MEDIA","METAL",
    "MIGHT","MINOR","MINUS","MIXED","MODEL","MONEY","MONTH","MORAL","MOTOR","MOUNT",
    "MOUSE","MOUTH","MOVIE","MUSIC","NEEDS","NEVER","NEWLY","NIGHT","NOISE","NORTH",
    "NOTED","NOVEL","NURSE","OCCUR","OCEAN","OFFER","OFTEN","ORDER","OTHER","OUGHT",
    "PAINT","PANEL","PAPER","PARTY","PEACE","PHASE","PHONE","PHOTO","PIECE","PILOT",
    "PITCH","PLACE","PLAIN","PLANE","PLANT","PLATE","POINT","POUND","POWER","PRESS",
    "PRICE","PRIDE","PRIME","PRINT","PRIOR","PRIZE","PROOF","PROUD","PROVE","QUEEN",
    "QUICK","QUIET","QUITE","RADIO","RAISE","RANGE","RAPID","RATIO","REACH","READY",
    "REFER","RIGHT","RIVER","ROUND","ROUTE","ROYAL","RURAL","SCALE","SCENE","SCOPE",
    "SCORE","SENSE","SERVE","SEVEN","SHALL","SHAPE","SHARE","SHARP","SHEET","SHELF",
    "SHELL","SHIFT","SHIRT","SHOCK","SHOOT","SHORT","SHOWN","SIGHT","SINCE","SIXTH",
    "SIXTY","SIZED","SKILL","SLEEP","SLIDE","SMALL","SMART","SMILE","SMITH","SMOKE",
    "SOLID","SOLVE","SORRY","SOUND","SOUTH","SPACE","SPARE","SPEAK","SPEED","SPEND",
    "SPENT","SPLIT","SPOKE","SPORT","STAFF","STAGE","STAKE","STAND","START","STATE",
    "STEAM","STEEL","STICK","STILL","STOCK","STONE","STOOD","STORE","STORM","STORY",
    "STRIP","STUCK","STUDY","STUFF","STYLE","SUGAR","SUITE","SUPER","SWEET","TABLE",
    "TAKEN","TASTE","TAXES","TEACH","TEAM","TERMS","TEXAS","THANK","THEFT","THEIR",
    "THEME","THERE","THESE","THICK","THING","THINK","THIRD","THOSE","THREE","THREW",
    "THROW","TIGHT","TIMES","TIRED","TITLE","TODAY","TOPIC","TOTAL","TOUCH","TOUGH",
    "TOWER","TRACK","TRADE","TRAIN","TREAT","TREND","TRIAL","TRIED","TRIES","TRUCK",
    "TRULY","TRUST","TRUTH","TWICE","UNDER","UNDUE","UNION","UNITY","UNTIL","UPPER",
    "UPSET","URBAN","USAGE","USUAL","VALID","VALUE","VIDEO","VIRUS","VISIT","VITAL",
    "VOICE","WASTE","WATCH","WATER","WHEEL","WHERE","WHICH","WHILE","WHITE","WHOLE",
    "WHOSE","WOMAN","WOMEN","WORLD","WORRY","WORSE","WORST","WORTH","WOULD","WOUND",
    "WRITE","WRONG","WROTE","YOUNG","YOUTH"
  ];

  const ROWS_TOTAL = 6;
  const WORD_LEN = 5;

  // Grid layout — centered on canvas.
  const CELL = 60;
  const GAP = 8;
  const GRID_W = WORD_LEN * CELL + (WORD_LEN - 1) * GAP;
  const GRID_H = ROWS_TOTAL * CELL + (ROWS_TOTAL - 1) * GAP;
  const GRID_X = (800 - GRID_W) / 2;
  const GRID_Y = 70;

  // === STATE ==============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const restartBtn = document.getElementById("restart");

  let target;       // chosen word
  let guesses;      // array of strings (committed guesses)
  let current;      // string being typed (length 0..WORD_LEN)
  let phase;        // "playing" | "gameover"
  let won;          // boolean (only meaningful at gameover)
  let score;        // number of correctly-placed letters across committed guesses
  let highScore = 0;
  let shakeMs;      // visual shake on invalid submit
  let lastTime;
  let loopId = null;
  let audioCtx = null;

  function reset() {
    target = WORDS[Math.floor(Math.random() * WORDS.length)];
    guesses = [];
    current = "";
    phase = "playing";
    won = false;
    score = 0;
    shakeMs = 0;
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (err) {
        console.error("loop error", err);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  function update(dt) {
    if (shakeMs > 0) shakeMs -= dt * 1000;
  }

  // === GAME LOGIC =========================================================
  function tryAddLetter(ch) {
    if (phase !== "playing") return;
    if (current.length >= WORD_LEN) return;
    current += ch;
    beep(720, 0.025);
  }

  function tryDelete() {
    if (phase !== "playing") return;
    if (current.length === 0) return;
    current = current.slice(0, -1);
    beep(360, 0.025);
  }

  function trySubmit() {
    if (phase !== "playing") return;
    if (current.length !== WORD_LEN) {
      shakeMs = 200;
      beep(160, 0.08);
      return;
    }
    // Score = correctly-placed letters in this guess (added to running total).
    let placed = 0;
    for (let i = 0; i < WORD_LEN; i++) {
      if (current[i] === target[i]) placed++;
    }
    score += placed;
    guesses.push(current);
    if (current === target) {
      phase = "gameover";
      won = true;
      score += 50;                     // bonus for winning
      if (score > highScore) highScore = score;
      beep(1040, 0.18);
    } else if (guesses.length >= ROWS_TOTAL) {
      phase = "gameover";
      won = false;
      if (score > highScore) highScore = score;
      beep(110, 0.25);
    } else {
      beep(540, 0.06);
    }
    current = "";
  }

  // Per-cell color for a committed guess letter ("correct" | "present" | "absent").
  function classify(guess, i) {
    const g = guess[i];
    if (g === target[i]) return "correct";
    // "present" only if there's an unmatched occurrence of g in target.
    let targetCount = 0, beforeCount = 0;
    for (let k = 0; k < WORD_LEN; k++) if (target[k] === g) targetCount++;
    for (let k = 0; k < WORD_LEN; k++) {
      if (guess[k] === g && k <= i) {
        if (k < i && guess[k] === target[k]) continue; // exact match doesn't consume
        beforeCount++;
      }
    }
    if (targetCount === 0) return "absent";
    return beforeCount <= targetCount ? "present" : "absent";
  }

  // === RENDER =============================================================
  function render() {
    ctx.fillStyle = "#0f1320";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Shake offset.
    const sx = shakeMs > 0 ? (Math.random() - 0.5) * 6 : 0;
    ctx.save();
    ctx.translate(sx, 0);

    // Grid.
    for (let r = 0; r < ROWS_TOTAL; r++) {
      const y = GRID_Y + r * (CELL + GAP);
      const guess = r < guesses.length ? guesses[r] : (r === guesses.length ? current : "");
      const committed = r < guesses.length;
      for (let c = 0; c < WORD_LEN; c++) {
        const x = GRID_X + c * (CELL + GAP);
        let bg = "#1c2030", border = "#2a2f44";
        if (committed) {
          const cls = classify(guess, c);
          bg = cls === "correct" ? "#52ffae" : cls === "present" ? "#ffd23f" : "#3a3a4a";
          border = bg;
        } else if (c < guess.length) {
          border = "#7df9ff";
        }
        ctx.fillStyle = bg;
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = border;
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);

        if (c < guess.length) {
          ctx.fillStyle = committed ? "#0a0a0f" : "#e6e6f0";
          ctx.font = "bold 32px ui-sans-serif, system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(guess[c], x + CELL / 2, y + CELL / 2);
        }
      }
    }
    ctx.restore();

    // Keyboard hints (used letters at bottom).
    drawKeyboard();

    // HUD.
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);
    ctx.textAlign = "right";
    ctx.fillText(`Guess ${Math.min(guesses.length + (phase === "playing" ? 1 : 0), ROWS_TOTAL)} / ${ROWS_TOTAL}  ·  Best ${highScore}`, canvas.width - 12, 22);

    if (phase === "gameover") {
      ctx.fillStyle = "rgba(10,10,15,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.font = "44px ui-sans-serif, system-ui";
      ctx.fillStyle = won ? "#52ffae" : "#ff52ae";
      ctx.fillText(won ? "Solved!" : "Out of guesses", canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "20px ui-sans-serif, system-ui";
      ctx.fillText(`Word was ${target}`, canvas.width / 2, canvas.height / 2 + 4);
      ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 32);
      ctx.fillStyle = "#a5a5b8";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 60);
    }
  }

  // Render rough A-Z status (best class seen so far for each letter).
  function drawKeyboard() {
    const status = {}; // letter -> "correct" | "present" | "absent"
    const better = { absent: 0, present: 1, correct: 2, undefined: -1 };
    for (const g of guesses) {
      for (let i = 0; i < WORD_LEN; i++) {
        const c = classify(g, i);
        if ((better[c] ?? -1) > (better[status[g[i]]] ?? -1)) status[g[i]] = c;
      }
    }
    const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
    const kw = 36, kh = 30, gap = 4;
    const baseY = 460;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      const totalW = row.length * kw + (row.length - 1) * gap;
      const x0 = (canvas.width - totalW) / 2;
      const y = baseY + r * (kh + gap);
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        const x = x0 + i * (kw + gap);
        const cls = status[ch];
        ctx.fillStyle = cls === "correct" ? "#52ffae"
                      : cls === "present" ? "#ffd23f"
                      : cls === "absent"  ? "#2a2a36"
                      : "#1c2030";
        ctx.fillRect(x, y, kw, kh);
        ctx.fillStyle = cls === "correct" || cls === "present" ? "#0a0a0f" : "#e6e6f0";
        ctx.font = "14px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ch, x + kw / 2, y + kh / 2);
      }
    }
  }

  // === INPUT ==============================================================
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "r" || ev.key === "R") { reset(); return; }
    if (phase !== "playing") return;
    if (ev.key === "Backspace") { tryDelete(); ev.preventDefault(); return; }
    if (ev.key === "Enter") { trySubmit(); return; }
    // Single A-Z letter.
    if (ev.key.length === 1) {
      const ch = ev.key.toUpperCase();
      if (ch >= "A" && ch <= "Z") tryAddLetter(ch);
    }
  });
  restartBtn.addEventListener("click", reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    // The "player" in a typing game = the current cursor cell.
    const row = Math.min(guesses.length, ROWS_TOTAL - 1);
    const col = Math.min(current.length, WORD_LEN - 1);
    const cx = GRID_X + col * (CELL + GAP) + CELL / 2;
    const cy = GRID_Y + row * (CELL + GAP) + CELL / 2;
    window.__game = {
      state: phase,                                   // "playing" | "gameover"
      score,
      player: { x: cx, y: cy, visible: true },        // grid is fully on-canvas
      objective: "Type a 5-letter word and press Enter. Green letters are right; yellow are misplaced. Six guesses.",
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
