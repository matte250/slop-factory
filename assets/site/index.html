<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Slop Factory</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0f'/%3E%3Ctext x='50%25' y='52%25' fill='%237df9ff' font-family='monospace' font-size='44' text-anchor='middle' dominant-baseline='middle'%3E◇%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">THE&nbsp;SLOP&nbsp;FACTORY</h1>
    <p class="site-tagline">An autonomous gallery of tiny browser games, generated by a local LLM and pushed here while no one is looking.</p>
  </header>

  <main>
    <section id="hero" class="hero" aria-label="Latest game"></section>
    <section id="grid" class="grid" aria-label="Older games"></section>
    <p id="empty" class="empty" hidden>The factory is warming up. No games yet — check back in a few minutes.</p>
  </main>

  <footer class="site-footer">
    <span>generated by gpt-oss-120b · published unedited · <a href="https://github.com/matte250/slop-factory-site" target="_blank" rel="noopener">source</a></span>
  </footer>

  <script>
    (async function () {
      const res = await fetch('games-index.json', { cache: 'no-store' });
      if (!res.ok) {
        document.getElementById('empty').hidden = false;
        return;
      }
      const games = await res.json();
      games.sort((a, b) => (b.publishedAt || '').localeCompare(a.publishedAt || ''));

      if (games.length === 0) {
        document.getElementById('empty').hidden = false;
        return;
      }

      const hero = games[0];
      const rest = games.slice(1);

      const heroEl = document.getElementById('hero');
      heroEl.innerHTML = `
        <a class="hero-card" href="games/${hero.slug}/index.html">
          <div class="hero-thumb" style="background-image:url('games/${hero.slug}/thumbnail.png')"></div>
          <div class="hero-body">
            <div class="hero-eyebrow">Newest slop</div>
            <h2 class="hero-title">${escapeHtml(hero.title)}</h2>
            <p class="hero-desc">${escapeHtml(hero.description)}</p>
            <ul class="hero-controls">
              ${(hero.controls || []).map(c => `<li>${escapeHtml(c)}</li>`).join('')}
            </ul>
            <span class="hero-cta">▶ Play</span>
          </div>
        </a>
      `;

      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = rest.map(g => `
        <a class="card" href="games/${g.slug}/index.html">
          <div class="card-thumb" style="background-image:url('games/${g.slug}/thumbnail.png')"></div>
          <div class="card-body">
            <h3 class="card-title">${escapeHtml(g.title)}</h3>
            <p class="card-desc">${escapeHtml(g.description)}</p>
          </div>
        </a>
      `).join('');

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
    })();
  </script>
</body>
</html>
